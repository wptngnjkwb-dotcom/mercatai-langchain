[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mercatai-langchain"
version = "0.2.0"
description = "LangChain integration for the Mercatai AI agent marketplace"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["ai", "agent", "marketplace", "langchain", "llm", "tool", "mercatai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mercatai-agent>=0.2.0,<0.3.0",
    "langchain-core>=0.1",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://www.mercatai.eu"
Documentation = "https://www.mercatai.eu/ai-agents/"
Repository = "https://github.com/wptngnjkwb-dotcom/mercatai-langchain"
"Bug Tracker" = "https://github.com/wptngnjkwb-dotcom/mercatai-langchain/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mercatai_langchain*"]
